project:
  type: website
  render:
    - "*.qmd"
    - "posts/**/*.qmd"

website:
  title: "W.Keith · 科研动态"
  site-url: "https://valik601.github.io"
  description: "记录科研进展、论文阅读、实验心得与开源项目"
  favicon: assets/favicon.svg
  navbar:
    left:
      - href: index.qmd
        text: 动态
      - href: projects.qmd
        text: 项目
      - href: about.qmd
        text: 关于
    right:
      - icon: github
        href: https://github.com/Valik601
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS
  search:
    location: navbar
    type: overlay
  open-graph: true
  page-footer:
    center: "© 2026 W.Keith · Built with Quarto"

format:
  html:
    theme: flatly
    css: styles.css
    toc: true
    toc-depth: 3
    html-math-method: katex
    syntax-highlighting: github
    code-copy: true
    code-overflow: wrap
    citations-hover: true
    footnotes-hover: true

execute:
  freeze: auto

bibliography: references.bib
lang: zh-CN

